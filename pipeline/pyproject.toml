[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xearth-clouds"
version = "0.1.0"
description = "Hourly data for xearth-web: GMGSI clouds, satellites, launches, hazards, lightning, snow and ice, smoke, tsunami, European weather warnings, GFS winds"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "netCDF4>=1.6", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["xearth_clouds"]

[tool.setuptools.package-data]
# MeteoAlarm's region outlines (scripts/bake_meteoalarm_regions.py).
xearth_clouds = ["meteoalarm_regions.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
