[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xearth-clouds"
version = "0.1.0"
description = "Hourly global cloud-alpha map for xearth-web, from NOAA GMGSI longwave IR"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "netCDF4>=1.6", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["xearth_clouds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
