# The built app from the image; each layer's folder from the pipeline's data volume.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The web app manifest (installable app / Android TWA) isn't in nginx's default types.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/manifest+json application/javascript text/css image/svg+xml;

    # The app shell: always revalidated, so a new build shows up on the next load.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Build output is content-hashed: it never changes under a name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Layer data and textures are also read cross-origin: by the Android (Capacitor) app,
    # whose page is https://localhost, and by any other site pointing its *src settings here.
    # (add_header inside a location replaces the server's, so each one repeats it; "always"
    # keeps the header on errors too, so a missing layer reads as a 404, not a CORS failure.)

    # Cloud maps are named by their scan time, so they never change either; the manifest does.
    location ~ ^/clouds/.+\.webp$ {
        root /data;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Every other layer: latest.json (and the snow/ice and smoke PNGs) are rewritten in place,
    # so the browser revalidates each time — a cheap 304 until the pipeline writes a new one.
    location ~ ^/(clouds|satellites|launches|storms|fires|lightning|events|snowice|smoke|tsunami)/ {
        root /data;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # NASA imagery: fixed files, large.
    location /textures/ {
        root /data;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Android TWA: Digital Asset Links, so Chrome trusts the app with this site (no URL bar).
    # Built into the site from web/public/.well-known/ (pnpm twa:assetlinks writes it).
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
