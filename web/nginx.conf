# The built app from the image; each layer's folder from the pipeline's data volume.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # The app shell: always revalidated, so a new build shows up on the next load.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Build output is content-hashed: it never changes under a name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cloud maps are named by their scan time, so they never change either; the manifest does.
    location ~ ^/clouds/.+\.webp$ {
        root /data;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Every other layer: latest.json (and the snow/ice and smoke PNGs) are rewritten in place,
    # so the browser revalidates each time — a cheap 304 until the pipeline writes a new one.
    location ~ ^/(clouds|satellites|launches|storms|fires|lightning|events|snowice|smoke|tsunami)/ {
        root /data;
        add_header Cache-Control "no-cache";
    }

    # NASA imagery: fixed files, large.
    location /textures/ {
        root /data;
        add_header Cache-Control "public, max-age=2592000";
    }
}
