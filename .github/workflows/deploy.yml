# Build the site with a fresh cloud map and publish it to GitHub Pages, and to
# Cloudflare once its secrets are set — on every push to main and once an hour.
# GMGSI files land in NOAA's bucket about 35–45 minutes after the hour, so the
# hourly run is scheduled at :50. CI runs first on the same commit, so neither a
# push nor an hourly rebuild publishes code the tests reject.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To drop the previous run's copy of the layers cache.
      actions: write
    env:
      # Every layer's folder (pipeline/xearth_clouds/run.py's JOBS), carried from one run to the
      # next. Each job writes its files atomically, so one that fails (its feed down for the
      # hour) leaves the last good files in place to publish again, as the Docker setup's data
      # volume does, instead of the site going out without that layer.
      LAYERS: |
        web/public/satellites
        web/public/launches
        web/public/storms
        web/public/fires
        web/public/lightning
        web/public/events
        web/public/snowice
        web/public/smoke
        web/public/tsunami
        web/public/meteoalarm
        web/public/ionosphere
        web/public/winds
        web/public/meteors
        web/public/buoys
        web/public/clouds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ./pipeline

      # Some jobs also read their own last output: CelesTrak updates GP data every 2 h and
      # refuses repeat downloads inside that window (satellites refetch when over 3 h old),
      # Launch Library 2 reuses pre-launch SupGP CelesTrak says hasn't changed, and
      # buoys/argo.json is the store Argo profiles are kept in.
      - name: Restore every layer from the last run
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LAYERS }}
          key: layers-${{ github.run_id }}
          restore-keys: layers-
      - name: Satellite elements from CelesTrak
        continue-on-error: true
        run: python -m xearth_clouds.satellites --out web/public/satellites

      # Launch Library 2's free tier allows ~15 requests an hour; this makes two.
      - name: Upcoming launches (Launch Library 2 + SpaceX pre-launch orbits)
        continue-on-error: true
        run: python -m xearth_clouds.launches --out web/public/launches

      # Aurora and earthquakes are fetched by the browser straight from NOAA SWPC and
      # USGS. Storms (GDACS + NHC need merging), fires (FIRMS, ~20 MB raw), lightning (GLM
      # buckets send no CORS headers), GDACS events, snow/ice (IMS needs reprojecting) and
      # smoke and tsunami bulletins (HMS and tsunami.gov send no CORS headers) come from here.
      # Radar (RainViewer), US tsunami alerts (NWS) and ISS telemetry (NASA ISSLive) are read
      # by the browser.
      - name: Tropical cyclones (GDACS + NHC)
        continue-on-error: true
        run: python -m xearth_clouds.storms --out web/public/storms
      - name: Active fires, last 24 h (NASA FIRMS VIIRS)
        continue-on-error: true
        run: python -m xearth_clouds.fires --out web/public/fires
      - name: Lightning, last 30 min (GOES-19 + GOES-18 GLM on AWS)
        continue-on-error: true
        run: python -m xearth_clouds.lightning --out web/public/lightning
      - name: Floods, wildfires, eruptions (GDACS)
        continue-on-error: true
        run: python -m xearth_clouds.events --out web/public/events
      - name: Snow and ice (NOAA IMS + Sea Ice Index)
        continue-on-error: true
        run: python -m xearth_clouds.snowice --out web/public/snowice
      - name: Smoke plumes (NOAA HMS)
        continue-on-error: true
        run: python -m xearth_clouds.smoke --out web/public/smoke
      - name: Tsunami bulletins (NOAA NTWC + PTWC)
        continue-on-error: true
        run: python -m xearth_clouds.tsunami --out web/public/tsunami
      - name: European weather warnings (MeteoAlarm; its feeds send no CORS headers)
        continue-on-error: true
        run: python -m xearth_clouds.meteoalarm --out web/public/meteoalarm
      - name: Ionosphere total electron content (NOAA SWPC GloTEC; 2.5 MB a map, so trimmed here)
        continue-on-error: true
        run: python -m xearth_clouds.ionosphere --out web/public/ionosphere
      - name: Winds at 10 m and 250 hPa (NOAA GFS via the NOMADS GRIB filter; no CORS, and GRIB)
        continue-on-error: true
        run: python -m xearth_clouds.winds --out web/public/winds
      - name: Meteors, last 24 h (Global Meteor Network) and fireballs (NASA/JPL CNEOS)
        continue-on-error: true
        run: python -m xearth_clouds.meteors --out web/public/meteors
      # Argo floats' latest profiles arrive a few hundred a day; without the carried
      # buoys/argo.json the job rebuilds it from the last 10 days, which takes ~10 min.
      - name: Buoys and their last 24 h (NOAA OSMC + NDBC, DART), and Argo floats
        continue-on-error: true
        run: python -m xearth_clouds.buoys --out web/public/buoys

      - name: Cache NASA textures
        uses: actions/cache@v4
        with:
          path: web/public/textures
          key: nasa-textures-v2
      - name: NASA textures (the cloud job uses Blue Marble as its clear-sky reference)
        run: node web/scripts/fetch-textures.mjs
      - name: Build cloud map from the newest GMGSI files (IR + visible by day)
        # A NOAA outage shouldn't block a deploy; the last map is published again.
        continue-on-error: true
        run: python -m xearth_clouds --out web/public/clouds

      # Caches can't be overwritten, so each run saves a new one and drops the one before:
      # the repo keeps a single copy instead of an hourly pile of them.
      - name: Save every layer for the next run
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LAYERS }}
          key: layers-${{ github.run_id }}
      - name: Drop the previous runs' copies of the layers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key layers- --limit 100 --json id,key \
            --jq '.[] | select(.key != "layers-${{ github.run_id }}") | .id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same build on Cloudflare (Workers static assets; web/wrangler.jsonc). Until the repo has
  # the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets this is a dry run: the Pages
  # artifact is unpacked and wrangler reads it, uploading nothing, so every step but the upload
  # has run before the first real deploy. Wrangler uploads only the files whose hashes changed,
  # so an hourly run sends the new layer data, not 60 MB.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pinned: a new wrangler reaches the deploy by a commit here, not on its own.
      WRANGLER: wrangler@4.151.3
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      # The Pages artifact is web/dist as one tar, artifact.tar.
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - run: mkdir -p web/dist && tar -xf artifact.tar -C web/dist && test -f web/dist/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes "$WRANGLER" deploy
        working-directory: web
      - name: Check the Cloudflare deploy (dry run until the secrets are set)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: npx --yes "$WRANGLER" deploy --dry-run
        working-directory: web
